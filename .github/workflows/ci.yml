name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 es donde se desarrolla; 3.8 es lo mas cercano al kernel Athena
        # (3.7) que ofrecen los runners. La compatibilidad real con 3.7 la
        # verifica tools/check_py37.py, que parsea con esa gramatica.
        python-version: ["3.8", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compatibilidad con Python 3.7
        run: python tools/check_py37.py

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: El bundle autocontenido se genera
        run: |
          python tools/build_single_notebook.py
          python -c "import json; nb = json.load(open('dist/automation_launcher_standalone.ipynb')); print(len(nb['cells']), 'celdas')"
